<!doctype html><html lang="{{ ui_language }}" translate="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOI4-EYES · Atlas</title><link rel="stylesheet" href="/static/world.css">
<header><div><small>HOI4–EYES</small><h1 data-en="World diplomacy" data-ru="Мировая дипломатия"></h1></div><select id="lang" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="fr">Français</option></select></header>
<main><section class="map-panel"><div class="toolbar"><select id="mode" aria-label="Map mode"><option value="regions" data-en="Regions · installed map" data-ru="Области · установленная карта"></option><option value="political" data-en="Political map" data-ru="Политическая карта"></option><option value="controller" data-en="Military control" data-ru="Военный контроль"></option><option value="provinces" data-en="Provinces" data-ru="Провинции"></option><option value="recognition" data-en="Recognition" data-ru="Признание"></option></select><div class="zoom"><button id="out" aria-label="Zoom out">−</button><button id="fit" data-en="Fit" data-ru="Весь мир"></button><button id="in" aria-label="Zoom in">+</button></div></div>
<label for="campaign" data-en="Snapshot campaign" data-ru="Кампания снимков"></label><select id="campaign"></select><button id="reloadSnapshots" data-en="Refresh snapshots" data-ru="Обновить снимки"></button><label for="pendingSession" data-en="Unassigned export session" data-ru="Непривязанная сессия экспорта"></label><select id="pendingSession"></select><button id="newBranch" data-en="Register new branch" data-ru="Зарегистрировать новую ветку"></button><button id="resumeBranch" data-en="Bind selected branch" data-ru="Привязать выбранную ветку"></button><span id="branchStatus" role="status"></span><select id="countryFocus" aria-label="Country"></select><select id="snapshotDate" aria-label="Snapshot date"></select><div id="notice" class="notice" role="status"></div><div id="viewport"><div id="surface"><canvas id="base"></canvas><canvas id="overlay"></canvas></div><div id="tooltip" hidden></div><div id="loading" data-en="Preparing world map…" data-ru="Подготовка карты мира…"></div></div><footer><span data-en="Wheel: zoom · Drag: move · Click: select region" data-ru="Колесо: масштаб · Перетаскивание: перемещение · Щелчок: выбор области"></span><span id="scale">100%</span></footer>
<details><summary data-en="Map data and limitations" data-ru="Данные карты и ограничения"></summary><p data-en="Geography follows the launcher playset. Live borders and territorial actions require compatible campaign data. Modified maps are available for viewing." data-ru="География берётся из набора модов лаунчера. Для границ кампании и территориальных действий нужны совместимые данные партии. Изменённые карты доступны для просмотра."></p></details></section>
<aside><nav><button id="makerTab" class="active" data-en="Country Maker" data-ru="Конструктор"></button><button id="atlasTab" data-en="Recognition" data-ru="Признание"></button></nav><section id="maker"><h2 data-en="A new state" data-ru="Новое государство"></h2><p id="makerPlayer" role="status"></p><label for="name" data-en="Country name" data-ru="Название государства"></label><input id="name" maxlength="120" autocomplete="off"><label for="countryTag" data-en="Country tag (optional, XAA–XZZ)" data-ru="Тег страны (необязательно, XAA–XZZ)"></label><input id="countryTag" maxlength="3" pattern="X[A-Z]{2}" placeholder="XAA" autocomplete="off" spellcheck="false"><div class="columns"><div><label for="capital" data-en="Capital region" data-ru="Столичная область"></label><select id="capital"></select></div><div><label for="status" data-en="Status" data-ru="Статус"></label><select id="status"><option value="independent" data-en="Independent" data-ru="Независимое"></option><option value="dependent" data-en="Puppet" data-ru="Марионетка"></option></select></div></div>
<h3 data-en="Selected regions" data-ru="Выбранные области"></h3><ul id="selection"></ul><button id="clear" class="subtle" data-en="Clear selection" data-ru="Очистить выбор"></button>
<label for="flag" data-en="Flag · preview only" data-ru="Флаг · только предпросмотр"></label><select id="flag"><option value="blue" data-en="Blue and gold" data-ru="Синий и золотой"></option><option value="red" data-en="Crimson and ivory" data-ru="Бордовый и белый"></option><option value="green" data-en="Green and silver" data-ru="Зелёный и серебряный"></option></select>
<label for="flagUpload" data-en="Custom PNG flag (preview)" data-ru="Свой флаг PNG (предпросмотр)"></label><input id="flagUpload" type="file" accept="image/png"><p id="flagError" role="status"></p><section class="country-design">
<h3 data-en="Government and map colour" data-ru="Правительство и цвет на карте"></h3>
<label for="countryColor" data-en="Map colour" data-ru="Цвет на карте"></label>
<div class="country-colour"><input id="countryColor" type="color" value="#294a69"><input id="countryHex" aria-label="HEX" required maxlength="7" pattern="#[0-9a-fA-F]{6}"></div>
<label for="initialIdeology" data-en="Starting ideology" data-ru="Начальная идеология"></label>
<select id="initialIdeology"><option value="" data-en="Keep the game's default" data-ru="Оставить выбор игры"></option></select>
<p data-en="Fill in the profiles you want to use. Titles appear with the leader's name." data-ru="Заполните нужные профили. Должность будет показана рядом с именем лидера."></p>
<datalist id="leaderTitles"><option data-en="President" data-ru="Президент"></option><option data-en="Prime Minister" data-ru="Премьер-министр"></option><option data-en="Chancellor" data-ru="Канцлер"></option><option data-en="Monarch" data-ru="Монарх"></option></datalist>
<div id="leaderProfiles"></div></section><button id="preview" class="primary" data-en="Preview country" data-ru="Предпросмотр государства"></button><button id="createCountry" class="primary" aria-describedby="createReason" disabled data-en="Create country" data-ru="Создать государство"></button><p id="createReason" class="warning" role="status"></p><div id="countryPassports"></div><article id="draft" hidden><span class="badge" data-en="DRAFT · NOT CREATED" data-ru="ПРОЕКТ · НЕ СОЗДАНО"></span><div id="flagPreview"></div><h2 id="draftName"></h2><p id="draftInfo"></p></article><p class="warning" data-en="Creation requires installing the test package and confirming in HOI4. The test package includes flag files." data-ru="Для создания нужно установить тестовый пакет и подтвердить действие в HOI4. Тестовый пакет включает файлы флага."></p></section>
<section id="atlas" hidden><h2 data-en="Recognition history" data-ru="История признания"></h2><label for="observer" data-en="Observer country tag" data-ru="Тег страны-наблюдателя"></label><input id="observer"><button id="load" class="primary" data-en="Show positions" data-ru="Показать позиции"></button><p data-en="Recognition colours: green legal recognition, red non-recognition, gold protest, blue de facto acceptance, grey unknown." data-ru="Цвета признания: зелёный — признание, красный — непризнание, золотой — протест, синий — фактическое принятие, серый — неизвестно."></p><p id="boundaryChanges" role="status"></p><div id="history" aria-live="polite"></div></section></aside></main><dialog id="confirmCountry"><h2 data-en="Review country proposal" data-ru="Проверка проекта государства"></h2><p id="confirmCountryName"></p><p id="confirmCountryTerms"></p><p data-en="Download a test package. In-game confirmation is required." data-ru="Скачайте тестовый пакет. Подтверждение потребуется в HOI4."></p><button id="downloadCountry" data-en="Confirm and download test package" data-ru="Подтвердить и скачать тестовый пакет"></button><form method="dialog"><button data-en="Close" data-ru="Закрыть"></button></form></dialog><script id="uiTranslations" type="application/json">{{ ui_translations|tojson }}</script><script src="/static/world.js"></script></html>
